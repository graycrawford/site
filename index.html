<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Selected products, projects, performances, presentations, and experience by Gray Crawford.">
  <title>Gray Crawford</title>
  <style>
    :root {
      --background: #fff;
      --font-color: #000;
      --link-color: #110563;
      --accent: #7e5566;
      --good-ease: cubic-bezier(.15, .02, 0, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* White past the page edges too (Safari's overscroll and toolbar take this, not body's). */
    html { background: var(--background); color-scheme: light; }
    body {
      background: var(--background);
      color: var(--font-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      overflow: auto;
    }
    a {
      color: var(--link-color);
      filter: blur(.65px);
      mix-blend-mode: plus-darker;
      text-decoration: none;
      transition: color .6s var(--good-ease), filter .6s var(--good-ease);
    }
    a:hover, a:focus-visible { color: #0400ff; filter: blur(2.5px); }
    .cv {
      align-items: flex-start;
      display: flex;
      gap: 20px;
      min-height: 100vh;
      overflow-x: auto;
      padding: 0 20px 0 0;
      scrollbar-width: none;
    }
    .cv::-webkit-scrollbar, .panel::-webkit-scrollbar { display: none; }
    .identity, .panel {
      flex: 0 0 352px;
      padding: 28px 20px 60px;
      scrollbar-width: none;
    }
    .identity {
      align-self: flex-start;
      background: transparent;
      flex-basis: var(--stage-w);
      left: 0;
      min-height: 100vh;
      padding-left: 28px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    :root { --stage-w: clamp(300px, 26vw, 400px); } /* ≥ 300: embedded tweets won't render narrower than 250px */
    /* The stage: while an entry is hovered or locked, its media covers the whole sidebar,
       starting level with the entry and scrolling with the page like the other columns. */
    .stage-media {
      background: var(--background);
      left: 0;
      opacity: 0;
      padding: 0 20px 28px 28px;
      pointer-events: none;
      position: absolute;
      right: 0;
      top: var(--stage-y, 0px);
      transition: opacity .25s var(--good-ease);
      z-index: 3;
    }
    /* Appears at once; only the fade-out is eased. */
    .identity.active .stage-media { opacity: 1; pointer-events: auto; transition: none; }
    .view { display: none; }
    .view.on { display: block; }
    .part + .part { margin-top: 16px; }
    .part-video video { background: #000; display: block; height: auto; width: 100%; }
    .part-youtube iframe { aspect-ratio: 16 / 9; background: #000; border: 0; display: block; width: 100%; }
    .tweet-frame { border: 0; display: block; height: 400px; max-width: 550px; width: 100%; }
    .instagram-frame { aspect-ratio: 9 / 19; border: 0; border-radius: 6px; display: block; max-width: 400px; width: 100%; }
    .page-frame { background: #fff; border: 0; border-radius: 6px; box-shadow: 0 0 0 1px rgba(17, 5, 99, .08); display: block; height: calc(100vh - 120px); width: 100%; }
    /* Previews at rest in the margin (vertical layout): one row per entry, as tall as the entry. */
    .previews { inset: 0; pointer-events: none; position: absolute; }
    .preview-row { cursor: pointer; display: flex; gap: 6px; left: 0; pointer-events: auto; position: absolute; }
    .preview-row > img, .preview-row > .mosaic { border-radius: 4px; height: 100%; width: auto; }
    .preview-row > img { display: block; object-fit: cover; }
    .mosaic { display: grid; overflow: hidden; }
    .still-set { display: flex; gap: 6px; height: 100%; }
    .still-set > * { height: 100%; }
    /* A tweet at rest: a 400×520 window onto the post, scaled to the row's height. */
    .tweet-mini { aspect-ratio: 400 / 520; border-radius: 4px; overflow: hidden; position: relative; }
    .tweet-mini iframe { border: 0; height: 520px; left: 0; pointer-events: none; position: absolute; top: 0; transform: scale(calc(var(--row-h, 60) / 520)); transform-origin: 0 0; width: 400px; }
    .mosaic img { display: block; height: 100%; min-height: 0; min-width: 0; object-fit: cover; width: 100%; }
    .tweet-frame + .tweet-frame { margin-top: 16px; }
    .part-tweet .twitter-tweet { filter: none; margin: 0 !important; }
    .part-image img { display: block; height: auto; width: 100%; }
    /* The site blurs links; a picture that links to its original stays sharp. */
    .part-image a, .part-image a:hover, .part-image a:focus-visible { filter: none; mix-blend-mode: normal; }
    .stage-caption {
      filter: blur(.62px);
      font-size: .84rem;
      margin-top: 10px;
      min-height: 1.4em;
      mix-blend-mode: plus-darker;
      opacity: .65;
    }
    /* Short enough that the grid and its caption fit on screen together. */
    .grid-host { aspect-ratio: 9 / 16; display: flex; justify-content: center; max-height: calc(100vh - 120px); width: 100%; }
    .grid { background: #000; overflow: hidden; position: relative; }
    .grid .cell { left: 0; overflow: hidden; position: absolute; top: 0; will-change: transform; }
    /* Each picture is placed by grid.js (left/top/width/height) so its crop can stay still on screen. */
    .grid video, .grid img { display: block; height: 100%; left: 0; max-width: none; object-fit: fill; position: absolute; top: 0; width: 100%; }
    .grid .full { opacity: 0; transition: opacity .25s var(--good-ease); }
    .grid .full.on { opacity: 1; }
    .entry[data-stage] { cursor: pointer; }
    .part-image img, .part-video video, .part-youtube iframe, .grid { border-radius: 6px; }
    .entry:hover, .entry.focused, .entry.match { transition: none; }
    /* Filters: hovering previews, clicking keeps; entries outside the chosen kinds fade back. */
    .filters { display: flex; flex-direction: column; margin-top: 14px; }
    .filters button {
      background: none; border: 0; color: var(--link-color); cursor: pointer; filter: blur(.65px);
      font: inherit; mix-blend-mode: plus-darker; opacity: .55; padding: 0; text-align: left;
      transition: filter .3s var(--good-ease), opacity .3s var(--good-ease);
    }
    .filters button .n { font-size: .73rem; font-variant-numeric: tabular-nums; margin-left: 5px; opacity: .45; }
    .filters button:hover, .filters button.on { filter: blur(0); opacity: 1; }
    .cv.filtering .entry:not(.match) { filter: blur(1.4px); opacity: .12; }
    .cv.filtering .entry.match { filter: blur(0); opacity: .82; }
    /* Section and year headings with nothing of the chosen kind fade back with their entries. */
    .cv.filtering .group.no-match .group-title, .cv.filtering .panel.no-match .year { filter: blur(1.4px); opacity: .12; }
    .preview-row { transition: opacity .3s var(--good-ease), filter .3s var(--good-ease); }
    .preview-row.no-match { filter: blur(1.4px); opacity: .12; }
    .panel[hidden] { display: none !important; } /* layouts that set .panel's display mustn't show hidden panels */
    .entry.focused { filter: blur(0); opacity: .82; }
    /* The entry being shown sits on a continuous-curvature round rect (drawn by stage.js):
       light while hovered, filled in once clicked. */
    .entry[data-stage] { isolation: isolate; position: relative; }
    .entry .hl { fill: rgba(17, 5, 99, .045); opacity: 0; pointer-events: none; position: absolute; transition: opacity .3s var(--good-ease), fill .3s var(--good-ease); z-index: -1; }
    .entry.focused .hl { opacity: 1; transition: none; }
    .entry.locked .hl { fill: rgba(17, 5, 99, .1); }
    .entry.focused .entry-title { filter: none; }
    @media (max-width: 700px) {
      /* No room beside the columns on a phone: a tapped entry opens its media over the page. */
      :root { --stage-w: 220px; }
      .stage-media { display: none; }
      .identity.active .stage-media {
        display: block;
        inset: 0;
        overflow-y: auto;
        padding: 16px;
        position: fixed;
      }
      .grid-host { max-height: calc(100dvh - 72px); }
    }
    .identity-card {
      isolation: isolate;
      position: relative;
    }
    .identity-card::before {
      -webkit-backdrop-filter: blur(18px);
      -webkit-mask-composite: source-in;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 48%, rgba(0, 0, 0, .94) 62%, rgba(0, 0, 0, .72) 76%, rgba(0, 0, 0, .32) 90%, transparent 100%), linear-gradient(180deg, #000 0%, #000 66%, rgba(0, 0, 0, .94) 76%, rgba(0, 0, 0, .72) 86%, rgba(0, 0, 0, .32) 95%, transparent 100%);
      backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, .42);
      content: "";
      inset: -28px -80px -50px -28px;
      mask-composite: intersect;
      mask-image: linear-gradient(90deg, #000 0%, #000 48%, rgba(0, 0, 0, .94) 62%, rgba(0, 0, 0, .72) 76%, rgba(0, 0, 0, .32) 90%, transparent 100%), linear-gradient(180deg, #000 0%, #000 66%, rgba(0, 0, 0, .94) 76%, rgba(0, 0, 0, .72) 86%, rgba(0, 0, 0, .32) 95%, transparent 100%);
      pointer-events: none;
      position: absolute;
      z-index: -1;
    }
    .name, .year {
      color: var(--font-color);
      filter: blur(2px);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.15;
      mix-blend-mode: plus-darker;
      opacity: .6;
      transition: filter .6s var(--good-ease);
    }
    .name:hover, .year:hover { filter: blur(3.6px); }
    .lastname { filter: blur(2.2px); transition: filter .6s var(--good-ease); }
    .lastname:hover { filter: blur(6.5px); }
    .nav { display: flex; gap: 5px; margin-top: 14px; }
    .nav-works { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
    .nav strong { display: contents; }
    .intro {
      color: var(--font-color);
      filter: blur(.75px);
      margin-top: 14px;
      mix-blend-mode: plus-darker;
      opacity: .6;
      transition: filter .6s var(--good-ease);
    }
    .intro:hover { filter: blur(1.4px); }
    .year { margin-bottom: 31px; }
    .group + .group { margin-top: 34px; }
    .group-title {
      color: var(--accent);
      filter: blur(.7px);
      font-size: .69rem;
      font-weight: 750;
      letter-spacing: .09em;
      margin-bottom: 13px;
      mix-blend-mode: plus-darker;
      text-transform: uppercase;
      transition: filter .6s var(--good-ease);
    }
    .group-title:hover { filter: blur(1.25px); }
    .entry {
      color: var(--font-color);
      filter: blur(.62px);
      mix-blend-mode: plus-darker;
      opacity: .65;
      transition: filter .6s var(--good-ease), opacity .6s var(--good-ease);
    }
    .entry + .entry { margin-top: 17px; }
    .entry:hover { filter: blur(0); opacity: .82; }
    .entry-head {
      align-items: baseline;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .entry-title { font-weight: 650; min-width: 0; }
    .date {
      font-size: .73rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .025em;
      opacity: .62;
      white-space: nowrap;
    }
    .place, .details { display: block; }
    .place { margin-top: 2px; }
    .details { font-size: .84rem; margin-top: 4px; opacity: .72; }
    .details-3, .details-10, .foot, .entry > .card, .entry > .app { display: none; } /* feet: tiles at the foot of a column in the grid version */
    .entry[data-hidden] { display: none; } /* kept, not shown */ /* the longer versions show in the reel's columns */
    .range { font-variant-numeric: tabular-nums; opacity: .55; }
    .year-media { margin-top: 44px; }
    .year + .year-media { margin-top: 0; }
    .tweet-cluster + .tweet-cluster { margin-top: 44px; }
    .twitter-tweet {
      filter: blur(3px);
      margin: 20px 0 !important;
      max-width: 100% !important;
      transition: filter .6s var(--good-ease);
    }
    .twitter-tweet:hover { filter: blur(0); }
    .tweet-glow {
      isolation: isolate;
      position: relative;
    }
    .tweet-glow::before {
      background: rgba(17, 5, 99, .18);
      border-radius: 50%;
      content: "";
      filter: blur(80px);
      inset: 6% -24%;
      pointer-events: none;
      position: absolute;
      z-index: -1;
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>

  <style>
    /* Tile version: a row of panels, stacked like Andy Matuschak's notes (tiles.js). The first is
       name and filters | the grid of the work; each open entry is a panel after it. Every panel is
       a full-height column that scrolls on its own; they stick 40px apart, so older ones fold under
       newer ones to a spine with their title. */
    html, body { height: 100%; overflow: hidden; overscroll-behavior-x: none; } /* a sideways swipe the reel doesn't take never turns into Back or Forward */
    .cv.stack { display: flex; height: 100vh; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; padding: 0; }
    .pane { background: var(--background); flex: 0 0 auto; height: 100%; position: sticky; transition: box-shadow .15s linear; }
    .pane > .scroll { height: 100%; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; }
    .pane > .scroll::-webkit-scrollbar { display: none; }
    .pane.home { width: var(--home-w, 860px); }
    .pane.home > .scroll { display: grid; grid-template-columns: min-content minmax(0, 1fr); }
    .pane.item { width: 520px; }
    .pane.item > .scroll { padding: 28px 32px 120px 40px; }
    .pane.over { box-shadow: 0 0 15px 3px rgba(0, 0, 0, .08); }
    .pane .spine { background: var(--background); border: 0; bottom: 0; color: var(--link-color); cursor: pointer; display: none; font: 600 .84rem/1 -apple-system, BlinkMacSystemFont, sans-serif; left: 0; padding: 28px 0 0; position: absolute; top: 0; width: 40px; z-index: 3; }
    .pane .spine span { display: block; margin: 0 auto; writing-mode: vertical-rl; }
    .pane.folded > .spine { display: block; }
    .pane .close { background: none; border: 0; color: var(--font-color); cursor: pointer; font-size: 1.2rem; line-height: 1; opacity: .35; position: absolute; right: 14px; top: 22px; }
    .pane .close:hover { opacity: .8; }
    /* The reel (the default; tiles.js): opening an entry slides the grid flush left at a third of
       the screen and lays every entry across the rest, the open one a full column, the others
       strips of their picture, narrowing with distance. */
    .cv.reel-mode { overflow: hidden; }
    .cv.reel-mode .pane.home { transition: width .5s var(--good-ease); width: 100%; }
    .cv.reel-mode .tile-col { padding: 28px 28px 160px 24px; }
    .cv.reel-mode.reading .pane.home { width: 30vw; }
    .cv.reel-mode.reading .identity { display: none; }
    .cv.reel-mode.reading .pane.home > .scroll { grid-template-columns: minmax(0, 1fr); }
    .cv.reel-mode.reading .tile-col { padding: 22px 8px 160px 12px; }
    .cv.reel-mode.reading .tile .words { font-size: calc(.74rem * var(--ws, 1)); padding: 7px 8px; } /* beside the reel: smaller type, the same inset at every size */
    .reel { flex: 1 1 0; height: 100%; min-width: 0; position: relative; touch-action: pan-y; } /* unclipped, so shadows fall softly onto the grid; the page clips at the window */
    .cv.reel-mode:not(.reading) .reel { display: none; }
    /* The reel starts just right of the grid, so the packed columns' tabs settle right beside the tiles. It blends onto the grid
       as one layer (multiply), so shadows and anything overlapping let the tiles show. */
    .cv.reel-mode.reading .reel { margin-left: 8px; }
    /* ?debug "sharp text": the soft blur off wherever it's on (filtering still dims what doesn't match) */
    html.sharp-text :is(a, .stage-caption, .filters button, .name, .year, .lastname, .intro, .group-title, .entry, .tyear h2, .tyear h3) { filter: none; mix-blend-mode: normal; }
    /* ?debug "dark grid while reading" */
    html.dark-grid :is(.cv.reel-mode.reading:not(.flow), .cv.flow.deep), html.dark-grid :is(.cv.reel-mode.reading:not(.flow), .cv.flow.deep) .tile-col { background: #000; } /* the grid and the strip of tabs beside it, up to the cards */
    html.dark-grid :is(.cv.reel-mode.reading:not(.flow), .cv.flow.deep) .tile-col :is(h2, h3) { color: #eee; }
    /* Flow (tiles.js): everything that changes between home and reading follows --u, 0 at home to 1 reading. */
    @property --u { syntax: '<number>'; inherits: true; initial-value: 0; }
    @property --ws { syntax: '<number>'; inherits: true; initial-value: 1; } /* a number, so the lens can read it mid-slide */
    .cv.reel-mode.flow.reading .pane.home { transition: none; width: calc((80 - 50 * var(--u)) * 1vw); } /* 80vw home, 30vw from the second entry on */
    .cv.reel-mode.flow.reading .tile-col { padding: calc(28px - 6px * var(--u)) calc(28px - 20px * var(--u)) 160px calc(24px - 12px * var(--u)); }
    .cv.reel-mode.flow.reading .tile .words { font-size: calc((.84rem - .1rem * var(--u)) * var(--ws)); padding: calc(12px - 5px * var(--u)) calc(12px - 4px * var(--u)); }
    .cv.flow.reading .tile[data-size=normal] { --ws: calc(1 - .5 * var(--u)); }
    .cv.flow.reading .tile[data-size=mini] { --ws: calc(.5 - .25 * var(--u)); }
    .cv.reel-mode.flow.reading:not(.deep) .reel-close { display: none; } /* nothing to close at home */
    /* The top bar across the whole window, over the grid and the reel alike, at every point of the slide. */
    /* In flow the name and filters head the grid and scroll away with it, laid out at the grid's reading width from the
       start: they never reflow as the split slides, so the grid starts where it will end up. */
    html.top-bar .cv.reel-mode.flow .identity { box-sizing: border-box; display: block; padding: 22px 12px 0 calc(24px - 12px * var(--u)); position: static; width: min(calc((80 - 50 * var(--u)) * 1vw), calc(max(30vw, 324px) + 12px - 12px * var(--u))); } /* the words keep one width as the inset changes; in a narrower window they keep their lines (300px of text: the name over two lines of intro, the tags in two rows) while the grid's pane has room */
    html.top-bar .cv.flow .identity-card::before { display: none; }
    .cv.flow .tile-col { touch-action: pan-y; } /* sideways drags slide the split */
    .identity .filters button .n { display: none; } /* no counts */
    html.top-bar .identity .intro { flex-basis: 100%; } /* the descriptors always under the name, never beside it */
    html.top-bar .identity .nav { flex-basis: 100%; } /* tw ig on a line of its own, between the bio and the tags */
    .identity .filters .row-break { flex-basis: 100%; height: 0; }
    .row-break { display: none; } html.top-bar .identity .filters .row-break { display: block; }
    .identity .filters button.let-go:not(.on) { filter: blur(.65px); opacity: .55; }
    /* Full-size columns placed by tiles.js (translateX); each lies over the one before it. */
    .reel .col { background: var(--background) center / cover no-repeat; height: 100%; left: 0; overflow: visible; position: absolute; top: 0; will-change: transform; }
    /* Its shadow on the column before it: an image strip (cheap to move; no blur), faded by tiles.js. */
    .reel .col > .shade { background: url(/stage/shade.png) 0 0 / 128px 256px repeat-y; height: 100%; pointer-events: none; position: absolute; right: 100%; top: 0; width: 128px; } /* a smooth falloff with blue-noise dither baked in (stage/shade.png), each column's at its own vertical offset, so stacked shadows average out instead of banding */
    .reel .col > .scroll { height: 100%; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; touch-action: pan-y; }
    /* Bookmarks: a tab of the entry's picture jutting from the column's left edge, in a row of its own,
       so the packed columns' tabs stack into a column. */
    .reel .col .mark { background: none; border: 0; cursor: pointer; height: 16px; left: -16px; padding: 0; position: absolute; top: 30px; width: 16px; z-index: 2; }
    .reel .col .mark .pic { background: #e9e9ef center / cover no-repeat; inset: 0; position: absolute; }
    /* A hovered tab's (or tile's) name: sharp text in a frosted capsule (the old sidebar's blur and
       white wash, behind the text only), fading in quickly beside the tab. It lives outside the moving
       columns (tiles.js), on whole pixels. */
    .tab-label { align-items: center; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); background: rgba(255, 255, 255, .42); border-radius: 999px; color: var(--link-color); display: flex; font: 650 .78rem/1 -apple-system, BlinkMacSystemFont, sans-serif; height: 26px; opacity: 0; padding: 0 11px; pointer-events: none; position: fixed; transition: opacity .12s linear; white-space: nowrap; z-index: 40; }
    .tab-label.on { opacity: 1; }
    .reel-debug { background: rgba(255, 255, 255, .9); border-radius: 10px; bottom: 12px; box-shadow: 0 1px 8px rgba(0, 0, 0, .12); display: grid; font: 11px/1.3 -apple-system, sans-serif; gap: 4px; left: 12px; padding: 10px 12px; position: fixed; z-index: 50; }
    .tile.hot::after { box-shadow: inset 0 0 0 2.5px var(--link-color); }
    .reel .col:not(.open) { cursor: pointer; }
    .reel .col .body { padding: 16px 16px 120px; } /* the same on top as at the sides: the gap between its pictures */
    .entry-view .media.posts { column-gap: 8px; columns: 2; } /* a year's posts, two across (masonry) */
    /* A row: pictures side by side at one height, each as wide as its proportions (tiles.js sets flex). */
    .entry-view .media .row { display: flex; gap: 8px; }
    .entry-view .media .row > * { flex: 1 1 0; min-width: 0; }
    .entry-view .media .row > * + * { margin-top: 0; }
    .entry-view .media .row img { height: auto; max-height: none; width: 100%; }
    .entry-view .part-image.alpha img { background: none; border-radius: 0; } /* transparent pictures stay plain */
    /* More of the same work under its own header, further down the column. */
    .entry-view .sub-head { margin: 34px 0 10px; }
    .entry-view .sub-head .title { font-size: 1rem; }
    .entry-view .media.posts > * { break-inside: avoid; margin: 0 0 8px; }
    .entry-view .media.posts > * + * { margin-top: 0; }
    .reel.scrolling iframe { pointer-events: none; }
    /* A live page fills its column; the entry's words float over it, where its own background shows. */
    .reel .col.page-card { background-color: #0b0b0d; } /* dark under the white words until the page (or its still) is there */
    .reel .col.page-card .body { height: 100%; padding: 0; }
    .reel .col > .veil { background: var(--background); inset: 0; opacity: 0; pointer-events: none; position: absolute; z-index: 1; } /* a page card fades back to the page colour as it packs down */
    .reel .col.page-card .entry-view { height: 100%; position: relative; }
    .reel .col.page-card .entry-view > :not(.media) { color: #fff; padding: 0 16px; pointer-events: none; position: relative; text-shadow: 0 0 12px rgba(0, 0, 0, .6); z-index: 1; }
    .reel .col.page-card .entry-view .title { padding-top: 16px; }
    .reel .col.page-card .entry-view a { color: #fff; pointer-events: auto; }
    .reel .col.page-card .entry-view .meta, .reel .col.page-card .entry-view .text { opacity: .85; }

  <script type="module" src="/stage/tiles.js"></script>

  <script>
    // Below 900px the whole page zooms down to fit the grid panel instead of reflowing; above,
    // the grid panel widens with the window while an entry panel still fits beside it.
    (() => {
      const DESIGN_W = 900, ENTRY_W = 520;
      const cv = document.querySelector('.cv');
      let width = -1; // only the width matters: on phones the height changes with every scroll (the address bar)
      function fit() {
        const w = document.documentElement.clientWidth, s = Math.min(1, w / DESIGN_W);
        if (w === width) return;
        width = w;
        cv.classList.toggle('scaled', s < 1);
        cv.style.setProperty('--s', s);
        cv.style.setProperty('--home-w', `${Math.max(860, Math.min(1200, w - ENTRY_W))}px`);
      }
      const ro = new ResizeObserver(fit);
      ro.observe(document.documentElement);
      addEventListener('resize', fit);
      fit();
    })();
  </script>
