<script type="module">
// ---------------------------------------------------------------------------
// Physics
//   Mass: a circular ring of radius a where every element is a Plummer sphere of
//   scale b (a fuzzy torus of density, nothing emissive, no surface).
//       Phi(rho,z) = -(2M/pi) K(m) / sqrt(D),  D = (rho+a)^2 + z^2 + b^2,  m = 4 a rho / D
//   Metric: ds^2 = -e^{2Phi} dt^2 + e^{-2Phi} dx^2 (isotropic static, exact to 1PN).
//   Null geodesics are rays in an index n = e^{-2Phi}:  dT/ds = -2 (grad Phi - (grad Phi . T) T)
//   G = c = 1, so M is in metres.
//
//   Each pixel carries three rays (centre, +1px x, +1px y). Their separation is the
//   pixel's footprint anywhere along the path, so:
//     - the environment is filtered over the exact lensed solid angle (surface brightness conserved)
//     - a mote smaller than the footprint contributes area/footprint of its radiance, so
//       focusing brightens it and spreading dims it.
// ---------------------------------------------------------------------------
const CN = 64, CD = 32;                           // coarse map of the light volume
const GEXT = 6, GN = 2048;                       // ground caustic map: +-6 m at 2048 px
const ALBEDO = new URLSearchParams(location.search).get('body') === 'body' ? 'vec3f(0.58, 0.57, 0.56)' : 'vec3f(0.80, 0.78, 0.74)';   // grey figure, or the plaster of the cast
const wgsl = /* wgsl */`
struct U {
  camPos: vec4f,    // xyz, tan(fov/2)
  camRight: vec4f,  // xyz, aspect
  camUp: vec4f,     // xyz, 1/envScale
  camFwd: vec4f,    // xyz, guide
  ring: vec4f,      // centre, M
  axis: vec4f,      // axis, a
  p: vec4f,         // b, step k, bend eps, max steps
  sun: vec4f,       // world dir, exposure
  res: vec4f,       // w, h, debug, peak
  sunE: vec4f,      // rgb irradiance, cos(env yaw)
  part: vec4f,      // density, radius, y offset, sin(env yaw)
  bmin: vec4f,      // body grid min, voxel
  bsize: vec4f,     // body grid size, capture height
  sh: array<vec4f, 9>,
  lorg: vec4f,      // light volume corner, fog density
  leu: vec4f,       // u axis, uv extent
  lev: vec4f,       // v axis, w extent
  lew: vec4f,       // propagation axis (-sun), run-up before the first slice
  fogp: vec4f,      // anisotropy, ambient gain, dispersion exponent, rayleigh mix
  fogq: vec4f,      // step length, jitter amount, sunlight gain, caustic reveal
  lsh: vec4f,       // ray sheet: centre offset along v, half extent, stretch k, (2 k X / sinh k)^2
};
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var sdfTex: texture_3d<f32>;
@group(0) @binding(2) var sdfSamp: sampler;
@group(0) @binding(3) var envTex: texture_2d<f32>;
@group(0) @binding(4) var envSamp: sampler;

const PI = 3.14159265358979;
const TAU = 6.28318530717959;
const CELL = 0.2;
const PC = vec3f(0.0, 1.5, 0.0);
const PR = 3.0;
const ALBEDO = ${ALBEDO};

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}

// ---- ring field ------------------------------------------------------------

fn gradPhi(x: vec3f) -> vec4f {
  let a = u.axis.w; let b = u.p.x; let ax = u.axis.xyz;
  let r = x - u.ring.xyz;
  let z = dot(r, ax);
  let rp = r - z * ax;
  let rho = length(rp);
  let zb = z * z + b * b;
  let D = (rho + a) * (rho + a) + zb;
  let m1 = ((rho - a) * (rho - a) + zb) / D;
  let m = 1.0 - m1;
  var ag = 1.0; var bg = sqrt(m1); var cs = 0.5 * m; var pw = 1.0;
  for (var i = 0; i < 5; i++) {
    let an = 0.5 * (ag + bg); let c = 0.5 * (ag - bg);
    bg = sqrt(ag * bg); ag = an; cs += pw * c * c; pw *= 2.0;
  }
  let K = PI / (2.0 * ag);
  let E = K * (1.0 - cs);
  var dK: f32;
  if (m < 0.03) { dK = 0.5 * PI * (0.5 + m * (0.0625 + m * 0.0234375)) / (2.0 * m1); }
  else { dK = (E - m1 * K) / (2.0 * m * m1); }
  let sD = sqrt(D);
  let C = 2.0 * u.ring.w / PI;
  let mrho = 4.0 * a * (D - 2.0 * rho * (rho + a)) / (D * D);
  let mz = -8.0 * a * rho * z / (D * D);
  let dPrho = -C * (dK * mrho / sD - K * (rho + a) / (D * sD));
  let dPz   = -C * (dK * mz   / sD - K * z         / (D * sD));
  let g = dPrho * rp / max(rho, 1e-6) + dPz * ax;
  return vec4f(g, (rho - a) * (rho - a) + z * z);
}

fn ringDist(x: vec3f) -> f32 {
  let r = x - u.ring.xyz;
  let z = dot(r, u.axis.xyz);
  let rho = length(r - z * u.axis.xyz);
  let b = u.p.x;
  return sqrt((rho - u.axis.w) * (rho - u.axis.w) + z * z + b * b);
}

fn bend(T: vec3f, g: vec3f, h: f32) -> vec3f { return normalize(T - 2.0 * h * (g - dot(g, T) * T)); }

// ---- scene -----------------------------------------------------------------

@group(0) @binding(5) var lightTex: texture_3d<f32>;
@group(0) @binding(6) var lightSamp: sampler;

// lensed sunlight at p: sum over ray sheets of magnification * direction to the light
fn lightCoord(p: vec3f) -> vec3f {
  let q = p - u.lorg.xyz;
  return vec3f(dot(q, u.leu.xyz) / u.leu.w, dot(q, u.lev.xyz) / u.leu.w, dot(q, u.lew.xyz) / u.lev.w);
}
fn sunVA(p: vec3f) -> vec4f {
  let c = lightCoord(p);
  let e = min(c, 1.0 - c);
  let f = smoothstep(0.0, 0.05, min(e.x, min(e.y, e.z)));
  if (f <= 0.0) { return vec4f(u.sun.xyz, 1.0); }
  return mix(vec4f(u.sun.xyz, 1.0), textureSampleLevel(lightTex, lightSamp, c, 0.0), f);
}
fn sunV(p: vec3f) -> vec3f { return sunVA(p).xyz; }
@group(0) @binding(9) var softTex: texture_3d<f32>;
fn sunAir(p: vec3f) -> vec4f {                 // the same light, from the softened copy
  let c = lightCoord(p);
  let e = min(c, 1.0 - c);
  let f = smoothstep(0.0, 0.05, min(e.x, min(e.y, e.z)));
  if (f <= 0.0) { return vec4f(u.sun.xyz, 1.0); }
  return mix(vec4f(u.sun.xyz, 1.0), textureSampleLevel(softTex, lightSamp, c, 0.0), f);
}
// distance from outside to the light volume's box
fn sdLight(p: vec3f) -> f32 {
  let c = lightCoord(p) - 0.5;
  let q = (abs(c) - 0.5) * vec3f(u.leu.w, u.leu.w, u.lev.w);
  return length(max(q, vec3f(0.0)));
}
// coarse map of the light volume: how far the light in each block strays from plain sunlight (x8, saturating)
@group(0) @binding(8) var devTex: texture_3d<f32>;

// The sun is a disc 0.53 degrees across, so a caustic softens by 4.65 mm per metre travelled from the lens.
// Surfaces average the light over that disc, which is also what removes the grid of the light volume.
const SUNR = 0.00465;
const DISC = array<vec2f, 8>(vec2f(0.354, 0.0), vec2f(-0.451, 0.413), vec2f(0.066, -0.787), vec2f(0.546, 0.762),
                             vec2f(-0.993, -0.116), vec2f(0.756, -0.654), vec2f(-0.156, 0.987), vec2f(-0.612, -0.791));
fn sunSoft(p: vec3f) -> vec3f {
  var v = sunVA(p).xyz;
  let r = SUNR * length(p - u.ring.xyz);
  if (u.ring.w <= 0.0 || r < 0.001) { return v; }
  for (var i = 0; i < 8; i++) { v += sunVA(p + r * (DISC[i].x * u.leu.xyz + DISC[i].y * u.lev.xyz)).xyz; }
  return v / 9.0;
}

// sunlight reaching the ground per unit area, as a fraction of the sun's irradiance: the ray sheet
// rasterised where it lands (r), and how much of the sheet covers the spot (g)
@group(0) @binding(7) var groundTex: texture_2d<f32>;
const GEXT = ${GEXT}.0;
fn groundTap(g: vec2f) -> f32 {
  let uv = vec2f(0.5 + 0.5 * g.x / GEXT, 0.5 - 0.5 * g.y / GEXT);
  let e = min(uv, 1.0 - uv);
  let t = textureSampleLevel(groundTex, lightSamp, uv, 0.0).rg;
  return mix(max(u.sun.y, 0.0), t.r, clamp(t.g, 0.0, 1.0) * smoothstep(0.0, 0.02, min(e.x, e.y)));
}
fn groundSun(g: vec3f) -> f32 {
  if (u.ring.w <= 0.0 || u.sun.y < 0.02) { return max(u.sun.y, 0.0); }
  var s = groundTap(g.xz);
  let r = SUNR * length(g - u.ring.xyz);
  for (var i = 0; i < 8; i++) {
    let o = r * (DISC[i].x * u.leu.xyz + DISC[i].y * u.lev.xyz);
    s += groundTap((g + o - u.sun.xyz * (o.y / u.sun.y)).xz);
  }
  return s / 9.0;
}

fn sdBody(p: vec3f) -> f32 {
  let bb = abs(p - (u.bmin.xyz + 0.5 * u.bsize.xyz)) - 0.5 * u.bsize.xyz;
  let db = length(max(bb, vec3f(0.0))) + min(max(bb.x, max(bb.y, bb.z)), 0.0);
  if (db > 0.0) { return db + 0.02; }
  return textureSampleLevel(sdfTex, sdfSamp, (p - u.bmin.xyz) / u.bsize.xyz, 0.0).r;
}

fn normalAt(p: vec3f) -> vec3f {
  let e = vec2f(1.5 * u.bmin.w, 0.0);
  return normalize(vec3f(sdBody(p + e.xyy) - sdBody(p - e.xyy), sdBody(p + e.yxy) - sdBody(p - e.yxy), sdBody(p + e.yyx) - sdBody(p - e.yyx)));
}

// ---- light -----------------------------------------------------------------

fn toEnv(d: vec3f) -> vec3f { let c = u.sunE.w; let s = u.part.w; return vec3f(c * d.x + s * d.z, d.y, -s * d.x + c * d.z); }

fn envGrad(d: vec3f, dd: vec3f) -> vec2f {
  let r2 = max(d.x * d.x + d.z * d.z, 1e-8);
  return vec2f((d.x * dd.z - d.z * dd.x) / (r2 * TAU), -dd.y / (PI * sqrt(r2)));
}

// radiance from world direction d, filtered over the footprint spanned by d1-d, d2-d
fn env(d: vec3f, d1: vec3f, d2: vec3f) -> vec3f {
  let e = toEnv(d);
  let uv = vec2f(atan2(e.z, e.x) / TAU + 0.5, acos(clamp(e.y, -1.0, 1.0)) / PI);
  return textureSampleGrad(envTex, envSamp, uv, envGrad(e, toEnv(d1 - d)), envGrad(e, toEnv(d2 - d))).rgb * u.camUp.w;
}

fn irrBands(nw: vec3f, k1: f32, k2: f32) -> vec3f {
  let n = toEnv(nw);
  let e = u.sh[0] + k1 * (u.sh[1] * n.y + u.sh[2] * n.z + u.sh[3] * n.x) + k2 * (u.sh[4] * n.x * n.y + u.sh[5] * n.y * n.z
        + u.sh[6] * (3.0 * n.z * n.z - 1.0) + u.sh[7] * n.x * n.z + u.sh[8] * (n.x * n.x - n.y * n.y));
  return max(e.rgb, vec3f(0.0));
}
fn irradiance(nw: vec3f) -> vec3f { return irrBands(nw, 1.0, 1.0); }

// shadow ray that follows the light path back through the field
fn shadow(p: vec3f, l: vec3f) -> f32 {
  var x = p; var T = l; var t = 0.012; var s = 1.0; var fin = false;
  let lens = u.ring.w > 0.0;
  for (var i = 0; i < 110; i++) {
    let d = sdBody(x);
    s = min(s, 60.0 * d / t);                    // penumbra about 1 degree wide, near the sun's own half degree
    if (d < 0.0004 || t > 6.0) { fin = true; break; }
    var h = clamp(0.6 * d, 0.003, 1.0);          // short of the full distance, so the nearest miss is sampled finely and the penumbra doesn't band
    if (lens) { h = min(h, u.p.y * ringDist(x)); }
    let xm = x + 0.5 * h * T;
    if (lens) { T = bend(T, gradPhi(xm).xyz, h); }
    x = xm + 0.5 * h * T; t += h;
  }
  if (!fin) { s = 0.0; }                       // still creeping along the figure after all those steps: in its shade
  return clamp(s, 0.0, 1.0);
}

fn ao(p: vec3f, n: vec3f) -> f32 {
  var o = 0.0; var w = 1.0;
  for (var i = 1; i <= 5; i++) {
    let h = 0.025 * f32(i);
    o += w * max(h - sdBody(p + n * h), 0.0);
    w *= 0.65;
  }
  return clamp(1.0 - 5.0 * o, 0.0, 1.0);
}

fn hash3(v: vec3u) -> vec3u {
  var x = v * 1664525u + 1013904223u;
  x.x += x.y * x.z; x.y += x.z * x.x; x.z += x.x * x.y;
  x ^= x >> vec3u(16u);
  x.x += x.y * x.z; x.y += x.z * x.x; x.z += x.x * x.y;
  return x;
}

fn oetf(c: vec3f) -> vec3f {
  let a = abs(c);
  return sign(c) * select(1.055 * pow(a, vec3f(1.0 / 2.4)) - 0.055, a * 12.92, a <= vec3f(0.0031308));
}

// ---- trace -----------------------------------------------------------------

fn camRay(uv: vec2f) -> vec3f {
  let th = u.camPos.w;
  return normalize(u.camFwd.xyz + uv.x * th * u.camRight.w * u.camRight.xyz + uv.y * th * u.camUp.xyz);
}

// Fog and motes along one straight piece of the path. The geodesic only needs steps as fine as the
// field demands; everything in the air is sampled inside each step, without re-evaluating the field.
struct Acc { col: vec3f, tr: vec3f, beta: vec3f, skyl: vec3f, fogR2: f32 };   // light gathered, transmittance, and per-pixel fog constants
fn media(o: vec3f, d: vec3f, len: f32, o1: vec3f, d1: vec3f, o2: vec3f, d2: vec3f, jit: f32, acc: ptr<function, Acc>) {
  let motes = u.part.x > 0.0;
  let rev = u.fogq.w;
  if (len <= 0.0 || (!motes && u.lorg.w <= 0.0 && rev <= 0.0)) { return; }
  let rp = u.part.y;
  let off = vec3f(0.0, u.part.z, 0.0);
  let g = u.fogp.x;
  let beta = (*acc).beta; let skyl = (*acc).skyl;
  // fog matters only inside the bank (or, for the reveal, inside the light volume, which the bank's reach covers)
  let om = o + d * 0.5 * len - PC;
  let reach = sqrt(max((*acc).fogR2, 0.0)) + 0.5 * len;
  let fogOn = (u.lorg.w > 0.0 || rev > 0.0) && dot(om, om) < reach * reach;
  if (!motes && !fogOn) { return; }
  let mu0 = dot(u.sun.xyz, d);
  let ph0 = mix((1.0 - g * g) / (4.0 * PI * pow(max(1.0 + g * g - 2.0 * g * mu0, 1e-3), 1.5)), 3.0 / (16.0 * PI) * (1.0 + mu0 * mu0), u.fogp.w);
  var t = 0.0;
  for (var i = 0; i < 64 && t < len; i++) {
    let p = o + d * t;
    var t1 = len; var inP = false;
    if (motes) {
      let dc = length(p - PC) - PR;
      if (dc > 0.0) { t1 = min(len, t + dc + 0.01); }
      else {
        inP = true;
        let fr = fract((p + off) / CELL);
        let ex = select(fr, 1.0 - fr, d > vec3f(0.0)) / max(abs(d), vec3f(1e-6)) * CELL;
        t1 = min(len, t + min(ex.x, min(ex.y, ex.z)) + 1e-4);
      }
    }
    if (fogOn) {
      // inside the light volume, walk in short pieces and ask the coarse map whether the light here is anything
      // but plain sunlight; only then is the full volume sampled at the fog step
      let c0 = lightCoord(p + d * 1e-3);
      let e0 = min(c0, 1.0 - c0);
      let inL = min(e0.x, min(e0.y, e0.z)) > 0.0;
      if (inL) { t1 = min(t1, t + 0.1); }
      else { t1 = min(t1, t + max(0.1, 0.9 * sdLight(p))); }
      let pm = o + d * 0.5 * (t + t1);
      let fogd = u.lorg.w * exp(-dot(pm - PC, pm - PC) / 25.0);
      let fine = inL && textureSampleLevel(devTex, lightSamp, lightCoord(pm), 0.0).r > 0.16;   // light here strays over 2% from plain sunlight
      if (fine) {
        // single scattering of the lensed sun plus sky light, at jittered points
        let ns = clamp(ceil((t1 - t) / u.fogq.x), 1.0, 24.0);
        let hs = (t1 - t) / ns;
        let a = 1.0 - exp(-fogd * hs * beta);
        for (var k = 0.0; k < ns; k += 1.0) {
          let j = fract(jit + 0.61803 * k + 0.37 * f32(i));
          let V = sunAir(o + d * (t + (k + 0.5 + u.fogq.y * (j - 0.5)) * hs));
          let mu = dot(normalize(V.xyz), d);
          let hg = (1.0 - g * g) / (4.0 * PI * pow(max(1.0 + g * g - 2.0 * g * mu, 1e-3), 1.5));
          let ph = mix(hg, 3.0 / (16.0 * PI) * (1.0 + mu * mu), u.fogp.w);      // Henyey-Greenstein to Rayleigh
          // caustic reveal: only the light the lens adds over plain sunlight scatters, and nothing is absorbed
          (*acc).col += (*acc).tr * (a * (u.sunE.rgb * V.w * ph + skyl) + rev * hs * u.sunE.rgb * max(V.w - 1.03, 0.0) * ph);
          (*acc).tr *= 1.0 - a;
        }
      } else if (fogd > 2e-4) {
        // plain sunlight: the whole piece in one go
        let a = 1.0 - exp(-fogd * (t1 - t) * beta);
        (*acc).col += (*acc).tr * a * (u.sunE.rgb * ph0 + skyl);
        (*acc).tr *= 1.0 - a;
      }
    }
    let pm = o + d * 0.5 * (t + t1);
    let tr = (*acc).tr;
    if (inP && max(tr.x, max(tr.y, tr.z)) > 0.003) {
      let cell = vec3i(floor((pm + off) / CELL));
      let hs = hash3(bitcast<vec3u>(cell));
      let rnd = vec3f(hs) / 4294967296.0;
      let pp = (vec3f(cell) + 0.1 + 0.8 * rnd) * CELL - off;
      let s = dot(pp - o, d);
      let keep = f32(hash3(hs).x) / 4294967296.0;
      let fall = smoothstep(PR, PR - 0.6, length(pp - PC));
      if (s >= t && s < t1 && keep < u.part.x * fall && pp.y > 0.01 && sdBody(pp) > rp) {
        let xc = o + d * s;
        let n1 = normalize(cross(d, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(d.y) > 0.9)));
        let n2 = cross(d, n1);
        let xi1 = o1 + d1 * s - xc; let xi2 = o2 + d2 * s - xc;
        let e1 = vec2f(dot(xi1, n1), dot(xi1, n2));
        let e2 = vec2f(dot(xi2, n1), dot(xi2, n2));
        let m11 = (e1.x * e1.x + e2.x * e2.x) / TAU + 0.5 * rp * rp;
        let m22 = (e1.y * e1.y + e2.y * e2.y) / TAU + 0.5 * rp * rp;
        let m12 = (e1.x * e1.y + e2.x * e2.y) / TAU;
        let det = max(m11 * m22 - m12 * m12, 1e-30);
        let dp = pp - xc;
        let d2v = vec2f(dot(dp, n1), dot(dp, n2));
        let q = (m22 * d2v.x * d2v.x - 2.0 * m12 * d2v.x * d2v.y + m11 * d2v.y * d2v.y) / det;
        let w = min(0.5 * rp * rp / sqrt(det), 1.0) * exp(-0.5 * q);
        if (w > 1e-4) {
          let VA = sunAir(pp);
          let vm = VA.w;
          let ca = clamp(dot(normalize(VA.xyz), -d), -1.0, 1.0);
          let al = acos(ca);
          let ph = (sin(al) + (PI - al) * ca) / PI;
          // snow: a white flake, part matte sphere (lit side faces the light), part ice that throws light forward.
          // The sun term carries the caustic magnification vm; the sky term is the matte sphere's disc average
          // under the environment, seen from the eye (band weights 1, 2/3, 1/4).
          let gs = 0.75;
          let fwd = (1.0 - gs * gs) / (4.0 * PI * pow(max(1.0 + gs * gs + 2.0 * gs * ca, 1e-3), 1.5));
          let lp = 0.95 * (u.sunE.rgb * vm * mix((2.0 / 3.0) * ph / PI, fwd, 0.3) + irrBands(-d, 2.0 / 3.0, 0.25) / PI);
          (*acc).col += (*acc).tr * w * lp;
          (*acc).tr *= 1.0 - w;
        }
      }
    }
    t = t1;
  }
}

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {

  }

}
`;

// Sunlight: a 512 x 512 sheet of parallel rays is marched through the field in lockstep.
// At each of 128 planes across the beam the deformed sheet is rasterised additively; a

fn sdBody(p: vec3f) -> f32 {

  let db = length(max(bb, vec3f(0.0))) + min(max(bb.x, max(bb.y, bb.z)), 0.0);

  let c = (vec2f(id.xy) + 0.5) / f32(LN) - 0.5;

struct Ray { pos: vec4f, dir: vec4f, aux: vec4f };

const GEXT = ${GEXT}.0;
fn landing(r: Ray) -> vec3f {                 // ground position (x, z) and whether the ray gets there

struct GV { @builtin(position) pos: vec4f, @location(0) uv0: vec2f, @location(1) ok: f32 };

class Spring {                                   // Orbital's critically damped spring
  constructor(value) { this.value = value; this.velocity = 0; }
  step(target, dt, f = 14) {

    this.value = target + (offset + c * dt) * decay;
    this.velocity = (this.velocity - f * c * dt) * decay;
    if (Math.abs(this.value - target) < 1e-5 * (1 + Math.abs(target)) && Math.abs(this.velocity) < 1e-4) { this.value = target; this.velocity = 0; return false; }
    return true;

  }
  const r = enc.beginRenderPass({ colorAttachments: [{ view: groundView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
  r.setPipeline(groundPipe); r.setBindGroup(0, groundBind); r.draw((LN - 1) * (LN - 1) * 6); r.end();

    const d = enc.beginRenderPass({ colorAttachments: [{ view: softView, depthSlice: k, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
    d.setPipeline(softPipe); d.setBindGroup(0, softBind); d.draw(3, 1, 0, k); d.end();
  }
  for (const [view, pipe, bind] of [[midView, devPipe, devBind], [devView, dev2Pipe, dev2Bind]]) for (let k = 0; k < CD; k++) {
    const d = enc.beginRenderPass({ colorAttachments: [{ view, depthSlice: k, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });

}
let lightKey = '';
const U = new Float32Array(NU);
const setSH = () => envMeta.sh.forEach((c, i) => U.set([c[0], c[1], c[2], 0], 52 + i * 4));
setSH();
// switch sky: the current one keeps rendering until the new one has loaded
let skyLoad = 0;
async function setSky(e) {
  if (e === env && !skyLoad) return;
  const token = ++skyLoad;
  try {
    const next = await envInfo(e);
    got = 0; total = next.end - next.start;
    const tex = await envTexture(next);
    if (token !== skyLoad) { tex.destroy(); return; }
    const old = envTex;
    envTex = tex; envMeta = next.meta; env = e; bind = makeBind(); setSH();
    lightKey = ''; dirty = true; label();
    try { localStorage.setItem('aureoleSky', e.id); } catch {}
    await device.queue.onSubmittedWorkDone(); old.destroy();
  } catch (x) { err.textContent = String(x.message || x).slice(0, 200); }
  if (token === skyLoad) { skyLoad = 0; bar.style.transform = 'scaleX(0)'; }
}

// preset bank: numbered slots under the sky names. click recalls, shift-click overwrites, alt-click deletes,
// + saves the current state, link copies a URL holding it, bank copies the whole bank as JSON.
const BUILTIN = [];
let bank = [];
try { bank = JSON.parse(localStorage.getItem('aureoleBank') || '[]'); } catch {}
const storeBank = () => { try { localStorage.setItem('aureoleBank', JSON.stringify(bank)); } catch {} };
function recall(p) {
  applyState(p, false);
  const e = ENVS.find(e => e.id === p.sky);
  if (e && e !== env) setSky(e);
}
const bankEl = $('div', 'bank');
const copy = async (el, text, word) => {
  try { await navigator.clipboard.writeText(text); el.textContent = 'copied'; } catch { el.textContent = 'blocked'; }
  setTimeout(() => { el.textContent = word; }, 900);
};
function drawBank() {
  bankEl.replaceChildren();
  [...BUILTIN, ...bank].forEach((p, i) => {
    const b = $('span', 'slot', String(i + 1)), own = i - BUILTIN.length;
    b.title = own < 0 ? 'recall' : 'click: recall · shift-click: overwrite · alt-click: delete';
    b.onclick = ev => {
      if (ev.altKey && own >= 0) { bank.splice(own, 1); curPreset = -1; storeBank(); drawBank(); }
      else if (ev.shiftKey && own >= 0) { bank[own] = snapshot(); curPreset = i; storeBank(); }
      else { recall(p); curPreset = i; }
      dirty = true;
    };
    bankEl.append(b);
  });
  const add = $('span', '', '+'), link = $('span', '', 'link'), all = $('span', '', 'bank');
  add.title = 'save the current state'; link.title = 'copy a link to the current state'; all.title = 'copy the bank as JSON';
  add.onclick = () => { bank.push(snapshot()); curPreset = BUILTIN.length + bank.length - 1; storeBank(); drawBank(); dirty = true; };
  link.onclick = () => { const url = location.origin + location.pathname + location.search + '#s=' + encState(snapshot()); history.replaceState(null, '', url); copy(link, url, 'link'); };
  all.onclick = () => copy(all, JSON.stringify(bank), 'bank');
  bankEl.append(add, link, all);
}
drawBank(); skies.after(bankEl);
updates.push(() => { let i = 0; for (const b of bankEl.querySelectorAll('.slot')) b.classList.toggle('on', i++ === curPreset); });
addEventListener('hashchange', () => { const p = hashState(); if (p) recall(p); });

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (hold.size) [w, h] = hold.size;
  const cap = 3.2e6;
  if (w * h > cap) { const s = Math.sqrt(cap / (w * h)); w = Math.round(w * s); h = Math.round(h * s); }
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
}
addEventListener('resize', resize); resize();

const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

let lastT = performance.now(), yOff = 0, frames = 0;
function loop(now) { requestAnimationFrame(loop); if (!hold.paused) frame(now); }
function frame(now) {
  const dt = clamp((now - lastT) / 1000 || 0, 0, 0.1); lastT = now;
  if (!canvas.width || !canvas.height) { resize(); dirty = true; return; }
  let moving = tickCamera(dt);
  for (const k in P) moving = P[k].s.step(P[k].v, dt, rate) || moving;
  const falling = cur('motes') > 0 && cur('fall') > 0 && !document.hidden;
  if (falling) yOff = (yOff + cur('fall') * dt) % (0.2 * 4096);
  if (!dirty && !moving && !falling) return;
  dirty = false; frames++;
  for (const f of updates) f();
  const dist = sDist.value, tgt = [0, sTy.value, 0];
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const pos = [tgt[0] + dist * cp * Math.sin(cam.yaw), tgt[1] + dist * sp, tgt[2] + dist * cp * Math.cos(cam.yaw)];
  pos[1] = Math.max(pos[1], 0.03);
  const fwd = norm([tgt[0] - pos[0], tgt[1] - pos[1], tgt[2] - pos[2]]);
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  const tl = cur('tilt') * Math.PI / 180, ey = cur('sun') * Math.PI / 180, ec = Math.cos(ey), es = Math.sin(ey);
  const sd = envMeta.sunDir;
  U.set([...pos, Math.tan(cam.fov * Math.PI / 360)], 0);
  U.set([...right, canvas.width / canvas.height], 4);
  U.set([...up, 1 / envMeta.scale], 8);
  U.set([...fwd, cur('guide')], 12);
  U.set([0, cur('height'), 0, cur('mass')], 16);
  U.set([0, Math.cos(tl), Math.sin(tl), cur('radius')], 20);
  U.set([cur('width'), 0.18, 0.04, 640], 24);
  U.set([ec * sd[0] - es * sd[2], sd[1], es * sd[0] + ec * sd[2], Math.pow(2, cur('exposure') + env.ev)], 28);
  U.set([canvas.width, canvas.height, debug, cur('peak')], 32);
  const gain = cur('sunlight');
  U.set([...envMeta.sunE.map(v => v * gain), ec], 36);
  U.set([cur('motes'), cur('mote') * 0.001, yOff, es], 40);
  U.set([...bodyMeta.min, bodyMeta.voxel], 44);
  U.set([bx * bodyMeta.voxel, by * bodyMeta.voxel, bz * bodyMeta.voxel, 1.6], 48);
  const sun = [U[28], U[29], U[30]], ew = sun.map(v => -v);
  const eu = norm(cross([0, 1, 0], ew)), ev = cross(ew, eu);
  // the slices run from just upstream of the ring to where the beam has gone into the ground, so none are spent elsewhere
  const wS = clamp(Math.min(-(cur('height') - 1) * sun[1] - cur('radius') - 0.5, -0.3), 0.2 - LBACK, 0);
  const wE = clamp(sun[1] > 0.05 ? (1 + 0.5 * LUV * Math.abs(ev[1])) / sun[1] + 0.1 : LW, wS + 1.5, LW - LBACK);
  const org = [0, 1, 2].map(i => [0, 1.0, 0][i] - 0.5 * LUV * (eu[i] + ev[i]) + wS * ew[i]);
  U.set([...org, cur('fog')], 88); U.set([...eu, LUV], 92); U.set([...ev, wE - wS], 96); U.set([...ew, LBACK + wS], 100);
  U.set([cur('anisotropy'), cur('ambient'), cur('dispersion'), cur('rayleigh'), cur('step'), cur('jitter'), gain, cur('caustic')], 104);

  for (let i = 0; i < 40; i++) { const k = 0.5 * (k0 + k1); if (2 * k * SX / Math.sinh(k) > 4.48) k0 = k; else k1 = k; }
  U.set([(cur('height') - 1) * ev[1], SX, k1, (2 * k1 * SX / Math.sinh(k1)) ** 2], 112);
  device.queue.writeBuffer(ubuf, 0, U);
  const enc = device.createCommandEncoder();
  const key = ['mass', 'radius', 'width', 'height', 'tilt', 'sun'].map(cur).join();
  if (key !== lightKey) { lightKey = key; traceSun(enc); }
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();

}
window.aureole = { hold, resize, P, cam, set, frame, snapshot, recall, bank: () => bank, setSky: id => setSky(ENVS.find(e => e.id === id)), sky: () => env.id, ENVS, setDebug: d => { debug = d; dirty = true; }, redraw: () => { dirty = true; }, frames: () => frames, device };
requestAnimationFrame(loop);
</script>
