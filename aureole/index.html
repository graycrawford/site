<script type="module">
// ---------------------------------------------------------------------------
// Physics
//   Mass: a circular ring of radius a where every element is a Plummer sphere of
//   scale b (a fuzzy torus of density, nothing emissive, no surface).
//       Phi(rho,z) = -(2M/pi) K(m) / sqrt(D),  D = (rho+a)^2 + z^2 + b^2,  m = 4 a rho / D
//   Metric: ds^2 = -e^{2Phi} dt^2 + e^{-2Phi} dx^2 (isotropic static, exact to 1PN).
//   Null geodesics are rays in an index n = e^{-2Phi}:  dT/ds = -2 (grad Phi - (grad Phi . T) T)
//   G = c = 1, so M is in metres.
//
//   Each pixel carries three rays (centre, +1px x, +1px y). Their separation is the
//   pixel's footprint anywhere along the path, so:
//     - the environment is filtered over the exact lensed solid angle (surface brightness conserved)
//     - a mote smaller than the footprint contributes area/footprint of its radiance, so
//       focusing brightens it and spreading dims it.
// ---------------------------------------------------------------------------
const wgsl = /* wgsl */`
struct U {
  camPos: vec4f,    // xyz, tan(fov/2)
  camRight: vec4f,  // xyz, aspect
  camUp: vec4f,     // xyz, 1/envScale
  camFwd: vec4f,    // xyz, guide
  ring: vec4f,      // centre, M
  axis: vec4f,      // axis, a
  p: vec4f,         // b, step k, bend eps, max steps
  sun: vec4f,       // world dir, exposure
  res: vec4f,       // w, h, debug, peak
  sunE: vec4f,      // rgb irradiance, cos(env yaw)
  part: vec4f,      // density, radius, y offset, sin(env yaw)
  bmin: vec4f,      // body grid min, voxel
  bsize: vec4f,     // body grid size, capture height
  sh: array<vec4f, 9>,
  lorg: vec4f,      // light volume corner, fog density
  leu: vec4f,       // u axis, uv extent
  lev: vec4f,       // v axis, w extent
  lew: vec4f,       // propagation axis (-sun)
};
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var sdfTex: texture_3d<f32>;
@group(0) @binding(2) var sdfSamp: sampler;
@group(0) @binding(3) var envTex: texture_2d<f32>;
@group(0) @binding(4) var envSamp: sampler;

const PI = 3.14159265358979;
const TAU = 6.28318530717959;
const CELL = 0.2;
const PC = vec3f(0.0, 1.5, 0.0);
const PR = 3.0;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}

// ---- ring field ------------------------------------------------------------

fn gradPhi(x: vec3f) -> vec4f {
  let a = u.axis.w; let b = u.p.x; let ax = u.axis.xyz;
  let r = x - u.ring.xyz;
  let z = dot(r, ax);
  let rp = r - z * ax;
  let rho = length(rp);
  let zb = z * z + b * b;
  let D = (rho + a) * (rho + a) + zb;
  let m1 = ((rho - a) * (rho - a) + zb) / D;
  let m = 1.0 - m1;
  var ag = 1.0; var bg = sqrt(m1); var cs = 0.5 * m; var pw = 1.0;
  for (var i = 0; i < 5; i++) {
    let an = 0.5 * (ag + bg); let c = 0.5 * (ag - bg);
    bg = sqrt(ag * bg); ag = an; cs += pw * c * c; pw *= 2.0;
  }
  let K = PI / (2.0 * ag);
  let E = K * (1.0 - cs);
  var dK: f32;
  if (m < 0.03) { dK = 0.5 * PI * (0.5 + m * (0.0625 + m * 0.0234375)) / (2.0 * m1); }
  else { dK = (E - m1 * K) / (2.0 * m * m1); }
  let sD = sqrt(D);
  let C = 2.0 * u.ring.w / PI;
  let mrho = 4.0 * a * (D - 2.0 * rho * (rho + a)) / (D * D);
  let mz = -8.0 * a * rho * z / (D * D);
  let dPrho = -C * (dK * mrho / sD - K * (rho + a) / (D * sD));
  let dPz   = -C * (dK * mz   / sD - K * z         / (D * sD));
  let g = dPrho * rp / max(rho, 1e-6) + dPz * ax;
  return vec4f(g, (rho - a) * (rho - a) + z * z);
}

fn ringDist(x: vec3f) -> f32 {
  let r = x - u.ring.xyz;
  let z = dot(r, u.axis.xyz);
  let rho = length(r - z * u.axis.xyz);
  let b = u.p.x;
  return sqrt((rho - u.axis.w) * (rho - u.axis.w) + z * z + b * b);
}

fn bend(T: vec3f, g: vec3f, h: f32) -> vec3f { return normalize(T - 2.0 * h * (g - dot(g, T) * T)); }

// ---- scene -----------------------------------------------------------------

@group(0) @binding(5) var lightTex: texture_3d<f32>;
@group(0) @binding(6) var lightSamp: sampler;

// lensed sunlight at p: sum over ray sheets of magnification * direction to the light
fn lightCoord(p: vec3f) -> vec3f {
  let q = p - u.lorg.xyz;
  return vec3f(dot(q, u.leu.xyz) / u.leu.w, dot(q, u.lev.xyz) / u.leu.w, dot(q, u.lew.xyz) / u.lev.w);
}
fn sunVA(p: vec3f) -> vec4f {
  let c = lightCoord(p);
  let e = min(c, 1.0 - c);
  let f = smoothstep(0.0, 0.05, min(e.x, min(e.y, e.z)));
  if (f <= 0.0) { return vec4f(u.sun.xyz, 1.0); }
  return mix(vec4f(u.sun.xyz, 1.0), textureSampleLevel(lightTex, lightSamp, c, 0.0), f);
}
fn sunV(p: vec3f) -> vec3f { return sunVA(p).xyz; }

fn sdBody(p: vec3f) -> f32 {
  let bb = abs(p - (u.bmin.xyz + 0.5 * u.bsize.xyz)) - 0.5 * u.bsize.xyz;
  let db = length(max(bb, vec3f(0.0))) + min(max(bb.x, max(bb.y, bb.z)), 0.0);
  if (db > 0.0) { return db + 0.02; }
  return textureSampleLevel(sdfTex, sdfSamp, (p - u.bmin.xyz) / u.bsize.xyz, 0.0).r;
}

fn normalAt(p: vec3f) -> vec3f {
  let e = vec2f(1.5 * u.bmin.w, 0.0);
  return normalize(vec3f(sdBody(p + e.xyy) - sdBody(p - e.xyy), sdBody(p + e.yxy) - sdBody(p - e.yxy), sdBody(p + e.yyx) - sdBody(p - e.yyx)));
}

// ---- light -----------------------------------------------------------------

fn toEnv(d: vec3f) -> vec3f { let c = u.sunE.w; let s = u.part.w; return vec3f(c * d.x + s * d.z, d.y, -s * d.x + c * d.z); }

fn envGrad(d: vec3f, dd: vec3f) -> vec2f {
  let r2 = max(d.x * d.x + d.z * d.z, 1e-8);
  return vec2f((d.x * dd.z - d.z * dd.x) / (r2 * TAU), -dd.y / (PI * sqrt(r2)));
}

// radiance from world direction d, filtered over the footprint spanned by d1-d, d2-d
fn env(d: vec3f, d1: vec3f, d2: vec3f) -> vec3f {
  let e = toEnv(d);
  let uv = vec2f(atan2(e.z, e.x) / TAU + 0.5, acos(clamp(e.y, -1.0, 1.0)) / PI);
  return textureSampleGrad(envTex, envSamp, uv, envGrad(e, toEnv(d1 - d)), envGrad(e, toEnv(d2 - d))).rgb * u.camUp.w;
}

fn irradiance(nw: vec3f) -> vec3f {
  let n = toEnv(nw);
  let e = u.sh[0] + u.sh[1] * n.y + u.sh[2] * n.z + u.sh[3] * n.x + u.sh[4] * n.x * n.y + u.sh[5] * n.y * n.z
        + u.sh[6] * (3.0 * n.z * n.z - 1.0) + u.sh[7] * n.x * n.z + u.sh[8] * (n.x * n.x - n.y * n.y);
  return max(e.rgb, vec3f(0.0));
}

// shadow ray that follows the light path back through the field
fn shadow(p: vec3f, l: vec3f) -> f32 {
  var x = p; var T = l; var t = 0.012; var s = 1.0;
  let lens = u.ring.w > 0.0;
  for (var i = 0; i < 72; i++) {
    let d = sdBody(x);
    s = min(s, 16.0 * d / t);
    if (d < 0.0004 || t > 6.0) { break; }
    var h = clamp(d, 0.003, 1.0);
    if (lens) { h = min(h, u.p.y * ringDist(x)); }
    let xm = x + 0.5 * h * T;
    if (lens) { T = bend(T, gradPhi(xm).xyz, h); }
    x = xm + 0.5 * h * T; t += h;
  }
  return clamp(s, 0.0, 1.0);
}

fn ao(p: vec3f, n: vec3f) -> f32 {
  var o = 0.0; var w = 1.0;
  for (var i = 1; i <= 5; i++) {
    let h = 0.025 * f32(i);
    o += w * max(h - sdBody(p + n * h), 0.0);
    w *= 0.65;
  }
  return clamp(1.0 - 5.0 * o, 0.0, 1.0);
}

fn hash3(v: vec3u) -> vec3u {
  var x = v * 1664525u + 1013904223u;
  x.x += x.y * x.z; x.y += x.z * x.x; x.z += x.x * x.y;
  x ^= x >> vec3u(16u);
  x.x += x.y * x.z; x.y += x.z * x.x; x.z += x.x * x.y;
  return x;
}

fn oetf(c: vec3f) -> vec3f {
  let a = abs(c);
  return sign(c) * select(1.055 * pow(a, vec3f(1.0 / 2.4)) - 0.055, a * 12.92, a <= vec3f(0.0031308));
}

// ---- trace -----------------------------------------------------------------

fn camRay(uv: vec2f) -> vec3f {
  let th = u.camPos.w;
  return normalize(u.camFwd.xyz + uv.x * th * u.camRight.w * u.camRight.xyz + uv.y * th * u.camUp.xyz);
}

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = vec2f(fc.x / u.res.x, 1.0 - fc.y / u.res.y) * 2.0 - 1.0;
  var T = camRay(uv);
  var T1 = camRay(uv + vec2f(2.0 / u.res.x, 0.0));
  var T2 = camRay(uv + vec2f(0.0, 2.0 / u.res.y));
  var x = u.camPos.xyz; var x1 = x; var x2 = x;
  let lens = u.ring.w > 0.0;
  let motes = u.part.x > 0.0;
  let n = i32(u.p.w);
  let off = vec3f(0.0, u.part.z, 0.0);
  let rp = u.part.y;
  var t = 0.0; var gm = 0.0; var glow = 0.0; var kind = 0; var steps = 0.0;
  var pcol = vec3f(0.0); var ptr = 1.0;
  let jit = f32(hash3(vec3u(vec2u(fc.xy), 7u)).x) / 4294967296.0;

  for (var i = 0; i < n; i++) {
    steps += 1.0;
    let ds = sdBody(x);
    if (ds < 0.0004 * (1.0 + 0.5 * t)) { kind = 1; break; }
    var h = min(ds, 60.0);
    if (lens) {
      h = min(h, u.p.y * ringDist(x));
      h = min(h, u.p.z / (2.0 * gm + 1e-5));
    }
    let fogd = u.lorg.w * exp(-dot(x - PC, x - PC) / 25.0);
    if (fogd > 2e-4) {
      let c = lightCoord(x);
      let e = min(c, 1.0 - c);
      h = min(h, select(0.5, 0.06, min(e.x, min(e.y, e.z)) > 0.0));
    }
    var inP = false;
    if (motes) {
      let dc = length(x - PC) - PR;
      if (dc > 0.0) { h = min(h, dc + 0.01); }
      else {
        inP = true;
        let fr = fract((x + off) / CELL);
        let ex = select(fr, 1.0 - fr, T > vec3f(0.0)) / max(abs(T), vec3f(1e-6)) * CELL;
        h = min(h, min(ex.x, min(ex.y, ex.z)) + 1e-4);
      }
    }
    h = max(h, 2e-4);
    let xm = x + 0.5 * h * T;
    let xm1 = x1 + 0.5 * h * T1;
    let xm2 = x2 + 0.5 * h * T2;
    if (lens) {
      let g = gradPhi(xm);
      gm = length(g.xyz);
      T = bend(T, g.xyz, h);
      T1 = bend(T1, gradPhi(xm1).xyz, h);
      T2 = bend(T2, gradPhi(xm2).xyz, h);
      glow += h * exp(-0.5 * g.w / (u.p.x * u.p.x)) / u.p.x;
    }
    let xn = xm + 0.5 * h * T;
    if (fogd > 2e-4) {
      // single scattering of the lensed sun plus sky light, sampled at a jittered point of the step
      let V = sunVA(x + jit * h * T);
      let mu = dot(normalize(V.xyz), T);
      let hg = 0.64 / (4.0 * PI * pow(1.36 - 1.2 * mu, 1.5));          // Henyey-Greenstein, g = 0.6
      let a = 1.0 - exp(-fogd * h);
      // sky: forward-weighted mix of the environment seen along the ray and the all-round mean
      let skyl = (0.7 * irradiance(T) + 0.3 * u.sh[0].rgb) / PI;
      pcol += ptr * a * (u.sunE.rgb * V.w * hg + skyl);
      ptr *= 1.0 - a;
    }
    if (xn.y < 0.0) {
      let f = x.y / (x.y - xn.y);
      x = mix(x, xn, f); t += h * f; kind = 3; break;
    }

    if (inP && ptr > 0.003) {
      let cell = vec3i(floor((xm + off) / CELL));
      let hs = hash3(bitcast<vec3u>(cell));
      let rnd = vec3f(hs) / 4294967296.0;
      let pp = (vec3f(cell) + 0.1 + 0.8 * rnd) * CELL - off;
      let dp = pp - xm;
      let s = dot(dp, T);
      let keep = f32(hash3(hs).x) / 4294967296.0;
      let fall = smoothstep(PR, PR - 0.6, length(pp - PC));
      if (abs(s) <= 0.5 * h && keep < u.part.x * fall && pp.y > 0.01 && sdBody(pp) > rp) {
        let n1 = normalize(cross(T, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(T.y) > 0.9)));
        let n2 = cross(T, n1);
        let xi1 = xm1 - xm; let xi2 = xm2 - xm;
        let e1 = vec2f(dot(xi1, n1), dot(xi1, n2));
        let e2 = vec2f(dot(xi2, n1), dot(xi2, n2));
        let m11 = (e1.x * e1.x + e2.x * e2.x) / TAU + 0.5 * rp * rp;
        let m22 = (e1.y * e1.y + e2.y * e2.y) / TAU + 0.5 * rp * rp;
        let m12 = (e1.x * e1.y + e2.x * e2.y) / TAU;
        let det = max(m11 * m22 - m12 * m12, 1e-30);
        let d2 = vec2f(dot(dp, n1), dot(dp, n2));
        let q = (m22 * d2.x * d2.x - 2.0 * m12 * d2.x * d2.y + m11 * d2.y * d2.y) / det;
        let w = min(0.5 * rp * rp / sqrt(det), 1.0) * exp(-0.5 * q);
        if (w > 1e-4) {
          let VA = sunVA(pp);
          let vm = VA.w;
          let ca = clamp(dot(normalize(VA.xyz), -T), -1.0, 1.0);
          let al = acos(ca);
          let ph = (sin(al) + (PI - al) * ca) / PI;
          let lp = 0.9 / PI * (u.sunE.rgb * vm * (2.0 / 3.0) * ph + u.sh[0].rgb);
          pcol += ptr * w * lp;
          ptr *= 1.0 - w;
        }
      }
    }

    x = xn; t += h;
    x1 = xm1 + 0.5 * h * T1;
    x2 = xm2 + 0.5 * h * T2;
    if (t > 200.0 || (x.y > 14.0 && T.y > 0.0)) { break; }
  }

  var col: vec3f;
  if (kind == 1) {
    let nn = normalAt(x);
    let V = sunV(x);
    let ndl = max(dot(nn, V), 0.0);
    var sh = 0.0;
    if (ndl > 0.0) { sh = shadow(x + nn * 0.004, normalize(V)); }
    col = vec3f(0.58, 0.57, 0.56) / PI * (irradiance(nn) * ao(x, nn) + u.sunE.rgb * ndl * sh);
  } else if (kind == 3) {
    // ground: the environment re-projected from its capture point onto y = 0, then shadowed
    let c = vec3f(0.0, u.bsize.w, 0.0);
    let g0 = vec3f(x.x, 0.0, x.z);
    let g1 = x1 + T1 * (-x1.y / min(T1.y, -1e-4));
    let g2 = x2 + T2 * (-x2.y / min(T2.y, -1e-4));
    let d0 = normalize(g0 - c);
    let base = env(d0, normalize(g1 - c), normalize(g2 - c));
    let up = vec3f(0.0, 1.0, 0.0);
    let ea = irradiance(up);
    let es = u.sunE.rgb * max(u.sun.y, 0.0);
    let V = sunV(g0);
    var sh = 1.0; var o = 1.0;
    if (length(g0.xz) < 8.0 && V.y > 1e-3) { sh = shadow(g0 + up * 0.004, normalize(V)); o = ao(g0, up); }
    col = base * (ea * o + u.sunE.rgb * max(V.y, 0.0) * sh) / (ea + es + 1e-6);
  } else {
    col = env(T, T1, T2);
  }
  col = pcol + ptr * col;
  col += vec3f(0.35, 0.6, 1.0) * glow * u.camFwd.w;

  if (u.res.z > 1.5) {       // sunlight magnification at the surface, 0.5 = unlensed
    if (kind == 0) { return vec4f(0.0, 0.0, 0.0, 1.0); }
    return vec4f(oetf(vec3f(0.18 * length(sunV(x)))), 1.0);
  }
  if (u.res.z > 0.5) { return vec4f(vec3f(steps / f32(n)), 1.0); }

  // exposure, hue-preserving shoulder up to display peak, extended sRGB
  col *= u.sun.w;
  let P = u.res.w; let k = min(0.8, P * 0.8);
  let m = max(col.r, max(col.g, col.b));
  if (m > k) {
    let m2 = k + (P - k) * (1.0 - exp(-(m - k) / (P - k)));
    col *= m2 / m;
    col = mix(col, vec3f(m2), 0.6 * smoothstep(k, P, m2));
  }
  return vec4f(oetf(col), 1.0);
}
`;

// Sunlight: a 512 x 512 sheet of parallel rays is marched through the field in lockstep.
// At each of 128 planes across the beam the deformed sheet is rasterised additively; a
// fragment's density is the Jacobian of (ray index -> position), so folds stack into caustics.
const LN = 512, LD = 128, LUV = 2.8, LW = 10, LBACK = 2.5, LSHEET = 1.6;   // sheet is wider than the volume so edge rays bent inward leave no gap
const common = wgsl.slice(0, wgsl.indexOf('// ---- scene'));
const lightC = common + /* wgsl */`

  if (w * h > cap) { const s = Math.sqrt(cap / (w * h)); w = Math.round(w * s); h = Math.round(h * s); }
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
}
addEventListener('resize', resize); resize();

const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

let lastT = performance.now(), yOff = 0, frames = 0, lightKey = '';
function loop(now) { requestAnimationFrame(loop); frame(now); }
function frame(now) {
  const dt = Math.min((now - lastT) / 1000 || 0, 0.1); lastT = now;
  if (!canvas.width || !canvas.height) { resize(); dirty = true; return; }
  let moving = tickCamera(dt);
  for (const k in P) moving = P[k].s.step(P[k].v, dt) || moving;
  const falling = cur('motes') > 0 && cur('fall') > 0 && !document.hidden;
  if (falling) yOff = (yOff + cur('fall') * dt) % (0.2 * 4096);
  if (!dirty && !moving && !falling) return;
  dirty = false; frames++;
  for (const f of updates) f();
  const dist = sDist.value, tgt = [0, sTy.value, 0];
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const pos = [tgt[0] + dist * cp * Math.sin(cam.yaw), tgt[1] + dist * sp, tgt[2] + dist * cp * Math.cos(cam.yaw)];
  pos[1] = Math.max(pos[1], 0.03);
  const fwd = norm([tgt[0] - pos[0], tgt[1] - pos[1], tgt[2] - pos[2]]);
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  const tl = cur('tilt') * Math.PI / 180, ey = cur('sun') * Math.PI / 180, ec = Math.cos(ey), es = Math.sin(ey);
  const sd = envMeta.sunDir;
  U.set([...pos, Math.tan(cam.fov * Math.PI / 360)], 0);
  U.set([...right, canvas.width / canvas.height], 4);
  U.set([...up, 1 / envMeta.scale], 8);
  U.set([...fwd, cur('guide')], 12);
  U.set([0, cur('height'), 0, cur('mass')], 16);
  U.set([0, Math.cos(tl), Math.sin(tl), cur('radius')], 20);
  U.set([cur('width'), 0.18, 0.04, 640], 24);
  U.set([ec * sd[0] - es * sd[2], sd[1], es * sd[0] + ec * sd[2], Math.pow(2, cur('exposure'))], 28);
  U.set([canvas.width, canvas.height, debug, cur('peak')], 32);
  U.set([...envMeta.sunE, ec], 36);
  U.set([cur('motes'), cur('mote') * 0.001, yOff, es], 40);
  U.set([...bodyMeta.min, bodyMeta.voxel], 44);
  U.set([bx * bodyMeta.voxel, by * bodyMeta.voxel, bz * bodyMeta.voxel, 1.6], 48);
  const sun = [U[28], U[29], U[30]], ew = sun.map(v => -v);
  const eu = norm(cross([0, 1, 0], ew)), ev = cross(ew, eu);
  const org = [0, 1, 2].map(i => [0, 1.0, 0][i] - 0.5 * LUV * (eu[i] + ev[i]) - LBACK * ew[i]);
  U.set([...org, cur('fog')], 88); U.set([...eu, LUV], 92); U.set([...ev, LW], 96); U.set([...ew, 0], 100);
  device.queue.writeBuffer(ubuf, 0, U);
  const enc = device.createCommandEncoder();
  const key = ['mass', 'radius', 'width', 'height', 'tilt', 'sun'].map(cur).join();
  if (key !== lightKey) { lightKey = key; traceSun(enc); }
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
}
window.aureole = { P, cam, set, frame, setDebug: d => { debug = d; dirty = true; }, redraw: () => { dirty = true; }, frames: () => frames, device };
requestAnimationFrame(loop);
</script>
